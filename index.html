<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Hindi Magic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --pink:#FFB5C2; --purple:#C3B1E1; --blue:#A8D8EA; --mint:#B5EAD7;
  --yellow:#FFEAA7; --peach:#FFDAB9; --lav:#E8D5F5;
  --bg:linear-gradient(135deg,#FFF0F5 0%,#F0E6FF 30%,#E6F3FF 60%,#F0FFF0 100%);
  --card:rgba(255,255,255,0.9); --ink:#4A3F6B; --ink2:#7B6FA0;
  --green:#5FCF8A; --red:#FF8B8B; --gold:#FFC94D;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Quicksand',sans-serif; color:var(--ink);
  background:var(--bg); background-attachment:fixed;
  min-height:100vh; overflow-x:hidden;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(12px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));display:flex;flex-direction:column}
h1,h2,h3,.deva,.big{font-family:'Baloo 2',sans-serif}
.deva{font-family:'Baloo 2',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;font-weight:700}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.coin-pill,.streak-pill{display:flex;align-items:center;gap:5px;background:var(--card);padding:7px 13px;border-radius:30px;font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(150,120,200,.18)}
.streak-pill{color:#E8852B}
.iconbtn{background:var(--card);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 10px rgba(150,120,200,.18)}
.spacer{flex:1}

/* mascot */
.kai{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#FFE0EC,#E8D5F5);display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:0 6px 18px rgba(180,140,220,.3);overflow:hidden}
.kai img{width:100%;height:100%;object-fit:contain;padding:6px}
.kai.float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* home */
.home-hero{text-align:center;margin-top:6vh}
.home-hero .kai{width:150px;height:150px;font-size:80px;margin:0 auto 16px}
.title{font-size:34px;font-weight:800;color:var(--ink);line-height:1.05}
.title .accent{background:linear-gradient(90deg,#FF8FB1,#B98FE6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:var(--ink2);font-size:16px;margin-top:8px;font-weight:600}
.bubble{background:var(--card);border-radius:20px;padding:14px 18px;margin:18px 0;box-shadow:0 4px 14px rgba(150,120,200,.15);font-size:16px;font-weight:600;color:var(--ink)}

.btn{display:block;width:100%;padding:17px;border-radius:18px;font-size:18px;font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.08);transition:transform .08s,box-shadow .08s;margin-bottom:12px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.btn.primary{background:linear-gradient(135deg,#FF9EBB,#C99AEC)}
.btn.green{background:linear-gradient(135deg,#7AD9A8,#5FCF8A)}
.btn.blue{background:linear-gradient(135deg,#8FD3EE,#7CB9E8)}
.btn.ghost{background:var(--card);color:var(--ink2);box-shadow:0 4px 12px rgba(150,120,200,.15);font-weight:700;font-size:16px;padding:14px}

/* generic screen header */
.screen-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{background:var(--card);border-radius:14px;padding:9px 14px;font-size:16px;font-weight:700;color:var(--ink2);box-shadow:0 3px 10px rgba(150,120,200,.15)}
.screen-title{font-size:23px;font-weight:800;color:var(--ink)}

/* world grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.world{background:var(--card);border-radius:20px;padding:18px 12px;text-align:center;box-shadow:0 4px 14px rgba(150,120,200,.15);transition:transform .1s;position:relative}
.world:active{transform:scale(.96)}
.world .wemoji{font-size:42px;line-height:1}
.world .wname{font-weight:700;font-size:15px;margin-top:8px;color:var(--ink)}
.world .wcount{font-size:12px;color:var(--ink2);margin-top:2px}
.world .wstars{margin-top:6px;font-size:13px;letter-spacing:1px;height:16px}

/* level select */
.lvl{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(150,120,200,.15);transition:transform .1s}
.lvl:active{transform:scale(.98)}
.lvl.locked{opacity:.5}
.lvl .lnum{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0}
.lvl .ltext{flex:1;text-align:left}
.lvl .lname{font-weight:800;font-size:17px;color:var(--ink)}
.lvl .ldesc{font-size:13px;color:var(--ink2);margin-top:1px}
.lvl .lstars{font-size:14px;letter-spacing:1px}
.l1{background:linear-gradient(135deg,#7AD9A8,#5FCF8A)}
.l2{background:linear-gradient(135deg,#8FD3EE,#7CB9E8)}
.l3{background:linear-gradient(135deg,#C99AEC,#A87CDB)}
.l4{background:linear-gradient(135deg,#FF9EBB,#F47CA0)}

/* quiz */
.progress-wrap{height:10px;background:rgba(255,255,255,.6);border-radius:10px;overflow:hidden;margin-bottom:18px}
.progress-bar{height:100%;background:linear-gradient(90deg,#7AD9A8,#5FCF8A);border-radius:10px;transition:width .4s}
.prompt{background:var(--card);border-radius:24px;padding:26px 18px;text-align:center;box-shadow:0 6px 18px rgba(150,120,200,.18);margin-bottom:14px}
.prompt .p-emoji{font-size:88px;line-height:1}
.prompt .p-deva{font-size:52px;font-weight:700;color:var(--ink)}
.prompt .p-en{font-size:30px;font-weight:800;color:var(--ink)}
.prompt .p-label{font-size:14px;color:var(--ink2);font-weight:600;margin-top:6px}
.audio-btn{background:linear-gradient(135deg,#8FD3EE,#7CB9E8);color:#fff;border-radius:18px;padding:16px 24px;font-size:20px;font-weight:800;display:inline-flex;align-items:center;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.audio-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.audio-btn.small{padding:10px 16px;font-size:16px;margin-top:14px}

.options{display:flex;flex-direction:column;gap:11px}
.options.two-col{display:grid;grid-template-columns:1fr 1fr}
.opt{background:var(--card);border-radius:16px;padding:16px;font-size:18px;font-weight:700;color:var(--ink);box-shadow:0 4px 12px rgba(150,120,200,.15);transition:transform .08s;text-align:center;border:3px solid transparent}
.opt .opt-deva{font-family:'Baloo 2';font-size:24px}
.opt .opt-translit{display:block;font-size:13px;color:var(--ink2);font-weight:600;margin-top:3px}
.opt:active{transform:scale(.97)}
.opt.correct{border-color:var(--green);background:#E9FBF1}
.opt.wrong{border-color:var(--red);background:#FFEDED}
.opt.disabled{pointer-events:none;opacity:.55}

.hint-btn{background:var(--yellow);color:#8A6D1E;border-radius:14px;padding:11px;font-weight:700;font-size:15px;width:100%;margin-top:14px;box-shadow:0 3px 10px rgba(200,170,90,.25)}
.hint-text{background:#FFF8E0;border-radius:14px;padding:12px;text-align:center;font-weight:700;color:#8A6D1E;margin-top:12px;font-size:16px}

/* feedback bar */
.feedback{position:fixed;left:0;right:0;bottom:0;padding:18px 16px calc(18px + var(--safe-bottom));background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(150,120,200,.2);text-align:center;animation:slideup .25s ease both;z-index:40}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.feedback .fb-msg{font-size:22px;font-weight:800;margin-bottom:4px}
.feedback.ok .fb-msg{color:var(--green)}
.feedback.no .fb-msg{color:var(--red)}
.feedback .fb-sub{color:var(--ink2);font-weight:600;font-size:15px;margin-bottom:12px}
.feedback .btn{margin-bottom:0}

/* L4 builder */
.build-box{min-height:70px;background:var(--card);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:14px;margin-bottom:14px;box-shadow:inset 0 2px 8px rgba(150,120,200,.12)}
.build-box .placeholder{color:var(--ink2);font-weight:600;font-size:15px}
.build-char{font-family:'Baloo 2';font-size:34px;font-weight:700;color:var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px}
.tile{background:linear-gradient(135deg,#FFE9F0,#EFE0FA);border-radius:14px;min-width:54px;height:58px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-size:30px;font-weight:700;color:var(--ink);box-shadow:0 4px 0 rgba(180,140,220,.25);padding:0 8px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(180,140,220,.25)}
.tile.used{opacity:.3;pointer-events:none}
.build-actions{display:flex;gap:10px;margin-bottom:6px}
.build-actions button{flex:1;border-radius:14px;padding:13px;font-weight:700;font-size:15px}
.b-clear{background:#FFE3E3;color:#C25555}
.b-back{background:#E6F0FA;color:#4A7AB0}
.b-check{background:linear-gradient(135deg,#7AD9A8,#5FCF8A);color:#fff;flex:1.4}

/* results */
.results{text-align:center;margin-top:5vh}
.results .kai{width:130px;height:130px;font-size:70px;margin:0 auto 14px}
.results .r-stars{font-size:46px;letter-spacing:4px;margin:10px 0}
.results .r-msg{font-size:24px;font-weight:800;color:var(--ink)}
.results .r-score{font-size:16px;color:var(--ink2);font-weight:600;margin:8px 0 4px}
.results .r-coins{font-size:20px;font-weight:800;color:#E8852B;margin-bottom:20px}

/* sticker book */
.sbook-head{text-align:center;margin-bottom:8px;font-weight:600;color:var(--ink2)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.sticker{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;box-shadow:0 3px 10px rgba(150,120,200,.15);overflow:hidden}
.sticker img{width:100%;height:100%;object-fit:contain;padding:5px}
.sticker.locked{background:#EDE7F5;color:#C3B8DC;font-size:24px}
.sticker .sname{font-size:9px;font-weight:700;color:rgba(74,63,107,.7);margin-top:2px}

/* reward modal */
.overlay{position:fixed;inset:0;background:rgba(74,63,107,.55);display:flex;align-items:center;justify-content:center;padding:22px;z-index:60;animation:fade .25s both}
.modal{background:#fff;border-radius:26px;padding:24px 20px;width:100%;max-width:380px;text-align:center;box-shadow:0 16px 50px rgba(74,63,107,.4)}
.modal h2{font-size:24px;color:var(--ink);margin-bottom:4px}
.modal p{color:var(--ink2);font-weight:600;margin-bottom:16px;font-size:15px}
.reward-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.reward-choices .sticker{aspect-ratio:1;font-size:40px;cursor:pointer;transition:transform .1s}
.reward-choices .sticker:active{transform:scale(.92)}

/* setup */
.setup{margin-top:6vh;text-align:center}
.name-input{width:100%;padding:15px;border-radius:16px;border:2px solid var(--lav);background:#fff;font-family:'Quicksand';font-size:18px;font-weight:700;color:var(--ink);text-align:center;margin:16px 0}
.name-input:focus{outline:none;border-color:var(--purple)}
.pack-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.pack{background:var(--card);border-radius:18px;padding:18px 10px;box-shadow:0 4px 12px rgba(150,120,200,.15);border:3px solid transparent;transition:transform .1s}
.pack:active{transform:scale(.96)}
.pack.sel{border-color:var(--purple);background:#F6EEFF}
.pack .pemoji{font-size:38px}
.pack .pname{font-weight:800;font-size:15px;margin-top:6px;color:var(--ink)}
.pack .psub{font-size:11px;color:var(--ink2);font-weight:600}

/* confetti */
.confetti{position:fixed;top:-20px;font-size:22px;z-index:80;pointer-events:none;animation:drop linear forwards}
@keyframes drop{to{transform:translateY(108vh) rotate(540deg);opacity:0}}

.tiny{font-size:12px;color:var(--ink2);text-align:center;margin-top:14px;font-weight:600;line-height:1.5}
/* home scatter collage */
.home2{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:calc(100vh - 56px)}
.home-scatter{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.chip{position:absolute;animation:floaty 4.6s ease-in-out infinite;opacity:.92}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.chip-inner{display:flex;flex-direction:column;align-items:center}
.chip-emoji{font-size:36px;line-height:1;filter:drop-shadow(0 3px 5px rgba(150,120,200,.22))}
.chip-hi{font-family:'Baloo 2';font-weight:700;font-size:12.5px;color:var(--ink);margin-top:1px;white-space:nowrap}
.chip-tl{font-size:9.5px;color:var(--ink2);font-weight:600;line-height:1.1;white-space:nowrap}
.home-hero2{position:relative;z-index:1;width:100%;text-align:center;padding:6px 0}
.home-hero2::before{content:"";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:120%;height:84%;background:radial-gradient(ellipse at center,rgba(255,253,255,.96) 0%,rgba(255,253,255,.84) 36%,rgba(255,253,255,0) 70%);z-index:-1;pointer-events:none}
.home-hero2 .kai{width:148px;height:148px;font-size:78px;margin:0 auto 6px}
.home-foot{position:absolute;bottom:6px;left:0;right:0;z-index:1}
.kai-img{display:block;margin:0 auto;height:150px;width:auto;filter:drop-shadow(0 9px 16px rgba(150,120,200,.32))}
.kai-img.float{animation:float 3s ease-in-out infinite}
.home-hero2 .kai-img{height:200px;margin-bottom:2px}
.results .kai-img{height:150px}
/* For-parents box + WhatsApp share */
.parents-box{position:relative;z-index:1;margin:16px auto 0;max-width:340px;width:100%;background:rgba(255,255,255,.72);border:1.5px dashed var(--purple);border-radius:16px;padding:13px 15px;text-align:center;backdrop-filter:blur(3px)}
.pb-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2);background:var(--lav);padding:3px 11px;border-radius:20px;margin-bottom:9px}
.pb-text{font-size:13px;color:var(--ink);font-weight:600;margin-bottom:11px;line-height:1.4}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;font-weight:800;font-size:15px;padding:13px;border-radius:14px;width:100%;box-shadow:0 4px 0 #1a9e4b;border:none;font-family:inherit;cursor:pointer}
.wa-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a9e4b}
.pb-note{font-size:11px;color:var(--ink2);margin-top:10px;line-height:1.45}
.pb-note b{color:var(--ink)}
</style>
</head>

const $app = document.getElementById("app");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function go(screen){ S.screen=screen; render(); }

// split a Devanagari word into grapheme tiles (consonant+matra stay together)
function graphemes(str){
  try{
    if(typeof Intl!=="undefined" && Intl.Segmenter){
      const seg = new Intl.Segmenter("hi",{granularity:"grapheme"});
      return [...seg.segment(str)].map(s=>s.segment).filter(g=>g.trim()!=="");
    }
  }catch(e){}
  return [...str].filter(g=>g.trim()!=="");
}

/* ---------- AUDIO (Web Speech API) — hardened for Android ---------- */
let hindiVoice = null, voicesReady = false;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    if(vs.length) voicesReady = true;
    const norm = v => ((v.lang||"").replace("_","-").toLowerCase());
    hindiVoice = vs.find(v=>norm(v)==="hi-in")
              || vs.find(v=>norm(v).startsWith("hi"))
              || vs.find(v=>/hindi/i.test(v.name||""))
              || null;
  }catch(e){}
}
if("speechSynthesis" in window){
  pickVoice();
  try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
}
/* Android needs speech unlocked inside the first real user gesture */
let ttsWarmed = false;
function warmUpTTS(){
  if(ttsWarmed || !("speechSynthesis" in window)) return;
  ttsWarmed = true;
  try{
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0; u.lang = "hi-IN";
    speechSynthesis.speak(u);
    pickVoice();
  }catch(e){}
}
if("speechSynthesis" in window){
  const unlock = ()=>{ warmUpTTS(); };
  window.addEventListener("pointerdown", unlock, {once:true});
  window.addEventListener("touchstart", unlock, {once:true});
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  try{
    if(!hindiVoice || !voicesReady) pickVoice();   // voices often arrive only after first interaction
    if(speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "hi-IN"; u.rate = 0.8; u.pitch = 1; u.volume = 1;
    if(hindiVoice) u.voice = hindiVoice;
    try{ speechSynthesis.resume(); }catch(e){}     // unstick a parked queue (Android/Chrome)
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- confetti ---------- */
function confetti(n){
  const ems=["🎉","⭐","✨","💫","🌟","🎊"];
  for(let i=0;i<(n||14);i++){
    const s=document.createElement("div");
    s.className="confetti"; s.textContent=ems[i%ems.length];
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(1.6+Math.random()*1.3)+"s";
    s.style.animationDelay=(Math.random()*0.3)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3200);
  }
}

/* ============================================================
   ROUND BUILDING
   ============================================================ */
const ROUND_LEN = 8;
function startRound(cat, lvl){
  S.cat=cat; S.lvl=lvl; S.qi=0; S.correctCount=0;
  S.answered=false; S.showHint=false; S.built=[];
  let pool = VOCAB.filter(w=>w.c===cat && (lvl!==1 || w.x) && (lvl!==4 || !/\s/.test(w.h)));
  pool = sample(pool, Math.min(ROUND_LEN, pool.length));
  S.qs = pool.map(w=>makeQ(w, lvl, cat));
  go("quiz");
}
function makeQ(w, lvl, cat){
  if(lvl===1){
    const others = sample(VOCAB.filter(o=>o!==w && o.x && o.c===cat), 2);
    let pool=[w,...others];
    while(pool.length<3){ const r=VOCAB[Math.random()*VOCAB.length|0]; if(r.x && !pool.includes(r)) pool.push(r);}
    return {type:1, w, options:shuffle(pool), answer:w.h};
  }
  if(lvl===2 || lvl===3){
    let others = sample(VOCAB.filter(o=>o!==w && o.c===cat), 2);
    while(others.length<2){ const r=VOCAB[Math.random()*VOCAB.length|0]; if(r!==w && !others.includes(r)) others.push(r);}
    return {type:lvl, w, options:shuffle([w,...others]), answer:w.e};
  }
  // level 4 — build tiles
  const target = graphemes(w.h);
  let distractPool = VOCAB.filter(o=>o!==w).flatMap(o=>graphemes(o.h));
  distractPool = distractPool.filter(g=>!target.includes(g));
  const distract = sample([...new Set(distractPool)], 3);
  return {type:4, w, target, tiles:shuffle([...target,...distract]), answer:target.join("")};
}

function render(){
  let h="";
  switch(S.screen){
    case "home":   h=renderHome(); break;
    case "setup":  h=renderSetup(); break;
    case "map":    h=renderMap(); break;
    case "levels": h=renderLevels(); break;
    case "quiz":   h=renderQuiz(); break;
    case "results":h=renderResults(); break;
    case "sbook":  h=renderSbook(); break;
    case "reward": h=renderReward(); break;
  }
  $app.innerHTML = h;
  $app.firstElementChild && $app.firstElementChild.classList.add("fade");
  // auto-speak read-aloud prompts on render
  if(S.screen==="quiz"){
    const q=S.qs[S.qi];
    if(q && (q.type===2) && !S.answered){ /* listen mode: wait for tap */ }
  }
}

    <div class="home-scatter">${chips}</div>
    <div class="home-hero2">
      ${kaiHTML("float")}
      <div class="title">Hindi <span class="accent">Magic</span></div>
      <div class="subtitle">${S.profile?("नमस्ते, "+S.profile.name+"! 👋"):"सीखो · खेलो · जीतो — learn Hindi the fun way"}</div>
      ${S.profile?`<div class="bubble">🪙 ${S.coins} · ⭐ ${S.collected.length}/${packStickers(S.profile.pack).length}</div>`:""}
      <button class="btn primary" onclick="${setup?"go('setup')":"go('map')"}">${setup?"Let's Start! 🚀":"Play 🎮"}</button>
      ${S.profile?`<button class="btn ghost" onclick="go('sbook')">My Sticker Book ⭐</button>`:""}
      ${S.profile?`<button class="btn ghost" onclick="switchPlayer()">Switch Player 🔄</button>`:""}
      <div class="parents-box">
        <div class="pb-tag">🔒 For Parents</div>
        <div class="pb-text">Enjoying Hindi Magic? Share it with other parents.</div>
        <button class="wa-btn" onclick="shareWhatsApp()">💬 Share on WhatsApp</button>
        <div class="pb-note">🔈 No sound on Android? Add a Hindi voice in <b>Settings › Accessibility › Text-to-speech › Google › Install voice data › Hindi</b>, then reopen the app.</div>
      </div>
    </div>
    <div class="tiny home-foot">Tap 🔊 anywhere to hear each word · Made with 💜</div>
  </div>`;
}

let setupName="", setupPack=null;
function renderSetup(){
  return `
  <div class="screen-head">
    <div class="back" onclick="go('home')">‹ Back</div>
  </div>
  <div class="setup">
    ${kaiHTML("")}
    <h2 style="font-size:24px;margin-top:14px;color:var(--ink)">What's your name?</h2>
    <input class="name-input" id="nameInput" placeholder="Type your name…" value="${setupName}" oninput="setupName=this.value" maxlength="14">
    <h3 style="font-size:18px;color:var(--ink);margin-bottom:10px">Pick your sticker pack</h3>
    <div class="pack-row">
      <div class="pack ${setupPack==='sparkle'?'sel':''}" onclick="selectPack('sparkle')">
        <div class="pemoji">🦄</div><div class="pname">Sparkle Pack</div><div class="psub">K-Pop · ponies · Barbie</div>
      </div>
      <div class="pack ${setupPack==='power'?'sel':''}" onclick="selectPack('power')">
        <div class="pemoji">🏎️</div><div class="pname">Power Pack</div><div class="psub">cars · dogs · aliens</div>
      </div>
    </div>
    <button class="btn green" style="margin-top:16px" onclick="finishSetup()">Start Playing! 🎉</button>
    <div class="tiny">You can change packs later by switching players.</div>
  </div>`;
}
function finishSetup(){
  const nm=(setupName||"").trim() || "Friend";
  if(!setupPack) setupPack="sparkle";
  S.profile={name:nm, pack:setupPack};
  S.coins=0; S.collected=[]; S.progress={}; S.streak=0;
  save(); go("map");
}
function switchPlayer(){
  setupName=""; setupPack=null;
  S.profile=null; save(); go("setup");
}
function selectPack(p){ setupPack=p; render(); }

function starStr(n){ return n>0 ? "⭐".repeat(n)+"☆".repeat(3-n) : "☆☆☆"; }
function bestStars(cat){
  let m=0; for(const L of LEVELS){ m=Math.max(m, S.progress[cat+"-"+L.n]||0); } return m;
}
function renderMap(){
  const cards = WORLDS.map(W=>{
    const count = VOCAB.filter(v=>v.c===W.c).length;
    const st = bestStars(W.c);
    return `<div class="world" onclick="S.cat='${W.c}';go('levels')">
      <div class="wemoji">${W.emoji}</div>
      <div class="wname">${W.name}</div>
      <div class="wcount">${count} words</div>
      <div class="wstars">${st>0?starStr(st):""}</div>
    </div>`;
  }).join("");
  return `${topbar(true)}
    <div class="screen-head"><div class="screen-title">Pick a World 🗺️</div></div>
    <div class="grid">${cards}</div>
    <div class="tiny">Earn ⭐⭐⭐ in every world!</div>`;
}

function renderLevels(){
  const W = WORLDS.find(w=>w.c===S.cat);
  const rows = LEVELS.map(L=>{
    const avail = (L.n!==1) || L1_OK.includes(S.cat);
    const st = S.progress[S.cat+"-"+L.n]||0;
    return `<div class="lvl ${avail?'':'locked'}" ${avail?`onclick="startRound('${S.cat}',${L.n})"`:""}>
      <div class="lnum ${L.cls}">${L.n}</div>
      <div class="ltext">
        <div class="lname">Level ${L.n} · ${L.name}${avail?"":" 🔒"}</div>
        <div class="ldesc">${avail?L.desc:"Picture mode isn't ready for this world — try Level 2!"}</div>
      </div>
      <div class="lstars">${avail?starStr(st):""}</div>
    </div>`;
  }).join("");
  return `${topbar(true)}
    <div class="screen-head">
      <div class="back" onclick="go('map')">‹</div>
      <div class="screen-title">${W.emoji} ${W.name}</div>
    </div>
    ${rows}
    <div class="tiny">Levels get trickier as you go. Pick what feels right!</div>`;
}

function renderQuiz(){
  const q = S.qs[S.qi];
  const pct = Math.round((S.qi)/S.qs.length*100);
  let promptHTML="", optionsHTML="", hintHTML="";

  if(S.showHint){
    hintHTML = `<div class="hint-text">💡 Sounds like: ${q.w.t}</div>`;
  }

  if(q.type===1){
    promptHTML = `<div class="prompt"><div class="p-emoji">${q.w.x}</div>
      <button class="audio-btn small" onclick="speak('${q.w.h}')">🔊 Hear it</button></div>`;
    optionsHTML = `<div class="options">` + q.options.map(o=>`
      <button class="opt ${S.answered?optClass(o.h,q):''}" onclick="answer('${o.h}')">
        <span class="opt-deva">${o.h}</span>
        ${S.showHint?`<span class="opt-translit">${o.t}</span>`:""}
      </button>`).join("") + `</div>`;
  }
  else if(q.type===2){
    promptHTML = `<div class="prompt">
      <button class="audio-btn" onclick="speak('${q.w.h}')">🔊 Tap to hear</button>
      <div class="p-label">What does it mean?</div></div>`;
    optionsHTML = optionList(q);
  }
  else if(q.type===3){
    promptHTML = `<div class="prompt"><div class="p-deva">${q.w.h}</div>
      <div class="p-label">What does it mean?</div>
      <button class="audio-btn small" onclick="speak('${q.w.h}')">🔊 Hear it</button></div>`;
    optionsHTML = optionList(q);
  }
  else if(q.type===4){
    const builtStr = S.built.map(i=>q.tiles[i]).join("");
    promptHTML = `<div class="prompt"><div class="p-en">${q.w.e}</div>
      <div class="p-label">Spell it in Hindi</div></div>
      <div class="build-box">${builtStr?`<span class="build-char">${builtStr}</span>`:`<span class="placeholder">Tap the tiles below…</span>`}</div>`;
    const tiles = q.tiles.map((t,i)=>`<button class="tile ${S.built.includes(i)?'used':''}" onclick="tapTile(${i})">${t}</button>`).join("");
    optionsHTML = `<div class="tiles">${tiles}</div>
      <div class="build-actions">
        <button class="b-back" onclick="backTile()">⌫ Back</button>
        <button class="b-clear" onclick="clearTiles()">Clear</button>
        <button class="b-check" onclick="checkBuild()">Check ✓</button>
      </div>`;
  }

  const hintLabel = (q.type===4) ? "💡 Show a letter" : "💡 Hint";
  const hintBtn = (!S.answered) ? `<button class="hint-btn" onclick="hintAction()">${hintLabel}</button>` : "";

  return `${topbar(false)}
    <div class="screen-head"><div class="back" onclick="go('levels')">✕</div>
      <div style="flex:1"></div>
      <div style="font-weight:700;color:var(--ink2)">${S.qi+1} / ${S.qs.length}</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    ${promptHTML}
    ${optionsHTML}
    ${q.type!==4?hintBtn:(!S.answered?hintBtn:"")}
    ${hintHTML}
    ${S.answered?feedbackBar():""}`;
}
function optionList(q){
  return `<div class="options">` + q.options.map(o=>`
    <button class="opt ${S.answered?optClass(o.e,q):''}" onclick="answer('${o.e.replace(/'/g,"\\'")}')">${o.e}</button>`).join("") + `</div>`;
}
function optClass(val,q){
  if(val===q.answer) return "correct";
  if(val===S.lastPick && val!==q.answer) return "wrong";
  return "disabled";
}

function feedbackBar(){
  const ok=S.lastCorrect;
  const q=S.qs[S.qi];
  const isLast = S.qi>=S.qs.length-1;
  return `<div class="feedback ${ok?'ok':'no'}">
    <div class="fb-msg">${ok?pick(["Shabaash! 🌟","Sahi! ✅","Wow! 🎉","Bahut badhiya!"]):"Almost! 💪"}</div>
    <div class="fb-sub">${ok?("+1 coin"):("The answer is "+q.w.h+" ("+q.w.t+") — "+q.w.e)}</div>
    <button class="btn ${ok?'green':'blue'}" onclick="nextStep()">${isLast?"Finish":"Next"} ›</button>
  </div>`;
}
function pick(a){ return a[Math.random()*a.length|0]; }

/* ---------- answering ---------- */
function answer(choice){
  if(S.answered) return;
  const q=S.qs[S.qi];
  S.lastPick=choice;
  resolveAnswer(choice===q.answer);
}
function tapTile(i){ if(S.answered) return; if(!S.built.includes(i)){ S.built.push(i); render(); } }
function backTile(){ if(S.answered) return; S.built.pop(); render(); }
function clearTiles(){ if(S.answered) return; S.built=[]; render(); }
function checkBuild(){
  if(S.answered) return;
  const q=S.qs[S.qi];
  const builtStr=S.built.map(i=>q.tiles[i]).join("");
  if(builtStr.length===0) return;
  S.lastPick=builtStr;
  resolveAnswer(builtStr===q.answer);
}
function resolveAnswer(correct){
  S.answered=true; S.lastCorrect=correct;
  if(correct){
    S.coins++; S.correctCount++; S.streak++;
    confetti(12); speak(S.qs[S.qi].w.h);
    if(S.streak>0 && S.streak%5===0) S.pendingReward=true;
  } else {
    S.streak=0;
  }
  save(); render();
}
function hintAction(){
  if(S.answered) return;
  const q=S.qs[S.qi];
  S.showHint=true;
  if(q && q.type===4){
    const next=q.target[S.built.length];
    if(next!==undefined){
      const idx=q.tiles.findIndex((t,i)=>t===next && !S.built.includes(i));
      if(idx>=0) S.built.push(idx);
    }
  }
  render();
}
function nextStep(){
  if(S.pendingReward){ S.pendingReward=false; openReward(); return; }
  advance();
}
function openReward(){
  const all=packStickers(S.profile.pack);
  const remaining=all.filter(s=>!S.collected.includes(s.id));
  S.rewardEmpty=remaining.length===0;
  S.rewardChoices=S.rewardEmpty?[]:sample(remaining, Math.min(3,remaining.length));
  S.screen="reward"; render();
}
function claimBonus(){ S.coins+=10; save(); afterReward(); }
function advance(){
  S.answered=false; S.showHint=false; S.built=[]; S.lastPick=null;
  S.qi++;
  if(S.qi>=S.qs.length){ finishRound(); }
  else render();
}
function finishRound(){
  const acc = S.correctCount/S.qs.length;
  const stars = acc>=0.99?3 : acc>=0.75?2 : acc>=0.5?1 : 0;
  const key=S.cat+"-"+S.lvl;
  S.progress[key]=Math.max(S.progress[key]||0, stars);
  S.roundStars=stars; save(); confetti(stars*12); go("results");
}

function renderResults(){
  const stars=S.roundStars||0;
  const msg = stars===3?"Perfect! आप superstar हैं! 🌟" : stars===2?"Great job! 👏" : stars===1?"Nice try — keep going! 💪" : "Let's practice again! 🌱";
  const W=WORLDS.find(w=>w.c===S.cat);
  return `
  <div class="results">
    ${kaiHTML("float")}
    <div class="r-stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <div class="r-msg">${msg}</div>
    <div class="r-score">You got ${S.correctCount} of ${S.qs.length} right</div>
    <div class="r-coins">🪙 ${S.coins} coins total</div>
    <button class="btn green" onclick="startRound('${S.cat}',${S.lvl})">Play Again 🔁</button>
    ${S.lvl<4?`<button class="btn blue" onclick="startRound('${S.cat}',${S.lvl+1})">Try Level ${S.lvl+1} ➜</button>`:""}
    <button class="btn ghost" onclick="go('levels')">Back to ${W.name}</button>
    <button class="btn ghost" onclick="go('map')">Choose Another World 🗺️</button>
  </div>`;
}

function renderSbook(){
  const stickers = S.profile? packStickers(S.profile.pack):SPARKLE;
  const cells = stickers.map(s=>{
    const got = S.collected.includes(s.id);
    if(got){
      const inner = s.img?`<img src="${s.img}" alt="${s.name}">`:`${s.emoji}<span class="sname">${s.name}</span>`;
      return `<div class="sticker" style="background:linear-gradient(135deg,#FFF0F8,#EFE6FB)">${inner}</div>`;
    }
    return `<div class="sticker locked">🔒</div>`;
  }).join("");
  return `${topbar(true)}
    <div class="screen-head"><div class="back" onclick="go('home')">‹</div>
      <div class="screen-title">Sticker Book ⭐</div></div>
    <div class="sbook-head">${S.collected.length} of ${stickers.length} collected · win one for every 5-in-a-row!</div>
    <div class="sgrid">${cells}</div>
    <div class="tiny">Keep your streak 🔥 going to unlock them all.</div>`;
}

function renderReward(){
  if(S.rewardEmpty){
    return `<div class="overlay"><div class="modal">
      <div style="font-size:54px">🏆</div>
      <h2>All stickers collected!</h2>
      <p>Amazing! Here are <b>+10 bonus coins</b> instead.</p>
      <button class="btn green" onclick="claimBonus()">Yay! 🎉</button>
    </div></div>`;
  }
  const cells = S.rewardChoices.map(s=>`
    <div class="sticker" style="background:linear-gradient(135deg,#FFF0F8,#EFE6FB)" onclick="collectSticker('${s.id}')">
      ${s.img?`<img src="${s.img}">`:`${s.emoji}<span class="sname">${s.name}</span>`}
    </div>`).join("");
  return `<div class="overlay"><div class="modal">
    <div style="font-size:50px">🔥</div>
    <h2>5 in a row!</h2>
    <p>Pick a sticker to keep:</p>
    <div class="reward-choices">${cells}</div>
  </div></div>`;
}
function collectSticker(id){
  if(!S.collected.includes(id)) S.collected.push(id);
  confetti(24); save(); afterReward();
}
function afterReward(){
  document.querySelectorAll(".overlay").forEach(e=>e.remove());
  S.screen="quiz";
  advance();
}

/* ============================================================
   INIT
   ============================================================ */
// expose handlers for inline onclick
Object.assign(window,{go,startRound,answer,tapTile,backTile,clearTiles,checkBuild,
  nextStep,speak,finishSetup,switchPlayer,collectSticker,afterReward,
  hintAction,openReward,claimBonus,selectPack,render,S,shareWhatsApp});
load();
render();
</script>
</body>
</html>
